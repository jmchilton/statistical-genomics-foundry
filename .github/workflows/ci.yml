name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # corepack reads `packageManager` from the root package.json, so the pnpm version
      # is pinned by the manifest rather than by this file.
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # The committed kind manifest must match what the schemas currently say. It is derived,
      # so it cannot drift from the schema — only from the schema's last regeneration.
      - run: pnpm run check:kinds
      # Each book's licence record is authored once in book.yml and copied into its chapters'
      # frontmatter. This is what stops a copy becoming a second source of truth.
      - run: pnpm run check:books
      # Frontmatter validator and the caster's own tests: negative fixtures, corpus conformance,
      # and what a slug names. Fails fast, before the fuller build.
      - run: pnpm test
      # Every committed bundle, re-cast and compared byte for byte. A cast is a pure function of
      # its Mold, the notes it cites and the target, so a bundle that no longer reproduces is
      # either stale or evidence the caster changed under it.
      - run: pnpm run check:casts
      # `build` is what deploy.yml runs on main; running it here fails the PR, not deploy.
      - run: pnpm run build
