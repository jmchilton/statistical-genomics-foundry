# The reference kinds this Foundry authors — the `kind:` of an entry in a Mold's
# `references[]` manifest.
#
# Only `kinds` lives here. The other four vocabularies a reference entry names —
# `used_at`, `load`, `modes`, `evidence` — describe the compilation machinery rather
# than any domain, so they are the same in every Foundry and ship as data in
# @galaxy-foundry/reference-contract. site/src/lib/reference-contract.ts composes the
# two halves, and is where the one inherited term this instance declines is recorded.
#
# `kinds` stays here because it is the half that genuinely varies: the parent Galaxy
# Workflow Foundry authors `cli-tool` and `schema` refs and we author neither, so
# inheriting its list would leave us declaring vocabulary no Mold uses.
#
# Trimmed from the parent's seven, corpus-first — this is exactly the kinds real Molds
# reference today:
#   drop: `cli-tool` (no tool-install refs authored here); `schema` (our outputs are
#         prose-shaped critiques/protocols, not structured artifacts — glossary
#         "Schema (Mold IO)", content/meta/architecture.md); `prompt` and `example` (inherited,
#         never authored against); and `eval` — the abstract oracle is real (glossary
#         "Evaluation plan") but it lives in an `eval.md` sibling, and no Mold has
#         needed it as a manifest entry.
#
# Re-adding any of these is a deliberate one-line edit made when a Mold first needs
# it — registering vocabulary ahead of content is what the drift check in
# site/tests/registry-drift.test.ts exists to catch.

kinds:
  pattern:
    label: Pattern
    description: A statistical-method or invalidity pattern page. Carried verbatim into casts.
    ref_shape: wiki-link
  research:
    label: Research
    description: Background synthesis from a source note, loaded by explicit progressive-disclosure metadata.
    ref_shape: wiki-link
  cli-command:
    label: CLI Command
    description: Command reference, carried verbatim and loaded only when invoked.
    ref_shape: wiki-link
